server:
  port: 8080

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
      - "/actuator/**"

  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 200

jwt:
  secret-key: a8F2kL9xQ7mP4zR6vN1sT5yH8cW3jK0dhhgfdhkijhffvkooyihnnhjfydjhifgx

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**, /v1/merchants/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**, /v1/payments/**

            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**

            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/v1/operations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

  metrics:
    tags:
      application: ${spring.application.name}
